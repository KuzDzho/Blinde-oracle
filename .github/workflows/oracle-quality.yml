name: Oracle quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/forecast-quality-no-houses

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: node --experimental-strip-types --test src/lib/oracle/generator.test.ts
